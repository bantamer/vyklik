<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- brand background: rounded square, works cropped to a circle too -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- ticket, slightly tilted -->
  <g transform="rotate(-7 256 256)" filter="url(#shadow)">
    <rect x="118" y="168" width="276" height="176" rx="30" fill="#ffffff"/>
    <!-- perforation between the stub and the main part -->
    <line x1="206" y1="182" x2="206" y2="330" stroke="#c7d2fe" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="2 22"/>
    <!-- stub: a "live" green dot = you get pinged -->
    <circle cx="162" cy="256" r="26" fill="#22c55e"/>
    <!-- main part: the V monogram -->
    <text x="300" y="256" font-family="Arial, Helvetica, sans-serif" font-size="150"
          font-weight="800" fill="url(#v)" text-anchor="middle" dominant-baseline="central">V</text>
  </g>
</svg>
